<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="VDP.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600&display=swap">
    <title>Veronica</title>
</head>
<body>
    <canvas id="c" aria-label="Estrellas moradas y blancas volando sobre fondo negro"></canvas>

        <b>Duque</b><br>

    <button id="next" type="button">Pausar</button>
    <div class="panel">

    </div>
